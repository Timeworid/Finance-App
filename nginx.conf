# Configuration Nginx pour FinancePilot (frontend + reverse proxy de l'API)

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Ne pas divulguer la version de nginx
    server_tokens off;

    # Taille max des requêtes (import CSV de 1000 transactions ≈ 200 Ko)
    client_max_body_size 2m;

    # Compression gzip
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript
               application/javascript application/json image/svg+xml;

    # En-têtes de sécurité (répétés dans chaque location qui ajoute ses propres en-têtes,
    # car nginx n'hérite pas des add_header du niveau server dans ce cas)
    set $csp "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'";

    add_header Content-Security-Policy $csp always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # Assets versionnés par Vite (nom avec hash) : cache long immuable
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header Content-Security-Policy $csp always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # Healthcheck du conteneur
    location = /health {
        access_log off;
        default_type text/plain;
        return 200 "OK\n";
    }

    # Reverse proxy vers l'API : même origine → pas de CORS, cookie SameSite=strict fonctionnel
    location /api/ {
        proxy_pass http://backend:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 10s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # Bloquer l'accès aux fichiers cachés
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    # SPA : toutes les routes renvoient index.html, jamais mis en cache
    # (pour que les nouveaux déploiements soient pris en compte immédiatement)
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
        add_header Content-Security-Policy $csp always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }
}

# HTTPS : en production, placer un proxy TLS en amont (Caddy, Traefik, Cloudflare…)
# ou ajouter un bloc "listen 443 ssl" avec vos certificats, puis :
#   - FORCE_HTTPS=true dans .env.docker
#   - add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
