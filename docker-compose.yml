# FinancePilot — déploiement Docker
# Usage : cp .env.docker.example .env.docker  (puis renseigner les secrets)
#         docker compose --env-file .env.docker up -d --build

services:
  # Base MongoDB : NON exposée sur l'hôte (accessible uniquement par le backend)
  mongodb:
    image: mongo:8
    container_name: financepilot-mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER:-admin}
      # Mot de passe obligatoire : plus de valeur par défaut "changeme"
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:?MONGO_ROOT_PASSWORD doit être défini}
      MONGO_INITDB_DATABASE: financepilot
      # Mot de passe du compte applicatif (droits readWrite sur financepilot uniquement)
      MONGO_APP_PASSWORD: ${MONGO_APP_PASSWORD:?MONGO_APP_PASSWORD doit être défini}
    volumes:
      - mongodb_data:/data/db
      - mongodb_config:/data/configdb
      - ./mongo-init.js:/docker-entrypoint-initdb.d/mongo-init.js:ro
    networks:
      - financepilot-network
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5

  # API backend : non exposée, nginx la relaie sur /api
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: financepilot-backend
    restart: unless-stopped
    init: true # Processus init minimal : signaux et processus zombies gérés
    environment:
      NODE_ENV: production
      PORT: 5000
      # Principe du moindre privilège : compte applicatif, pas le compte root
      MONGODB_URI: mongodb://financepilot_user:${MONGO_APP_PASSWORD}@mongodb:27017/financepilot?authSource=financepilot
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET doit être défini}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?JWT_REFRESH_SECRET doit être défini}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?ENCRYPTION_KEY doit être défini}
      # Origine publique de l'application (celle affichée dans le navigateur)
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost}
      TRUST_PROXY: 1
      FORCE_HTTPS: ${FORCE_HTTPS:-false}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    volumes:
      - backend_logs:/app/logs
    networks:
      - financepilot-network
    depends_on:
      mongodb:
        condition: service_healthy

  # Frontend (nginx) : seul service exposé
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: financepilot-frontend
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
    networks:
      - financepilot-network
    depends_on:
      backend:
        condition: service_healthy

volumes:
  mongodb_data:
  mongodb_config:
  backend_logs:

networks:
  financepilot-network:
    driver: bridge
